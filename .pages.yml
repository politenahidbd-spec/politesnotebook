media:
  input: public/uploads
  output: /uploads

content:
  - name: photography
    label: Photography
    type: collection
    path: src/content/photography
    filename: "{slug}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: slug, label: Slug, type: string, required: true }
      - { name: year, label: Year, type: string }
      - { name: location, label: Location, type: string }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: cover, label: Cover Image, type: image }
      - name: gallery
        label: Gallery
        type: image
        list: true
      - { name: excerpt, label: Excerpt, type: text }
      - { name: draft, label: Draft, type: boolean, default: false }
      - { name: featured, label: Featured, type: boolean, default: false }
      - { name: body, label: Body, type: rich-text }

  - name: writing
    label: Writing
    type: collection
    path: src/content/writing
    filename: "{slug}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: slug, label: Slug, type: string, required: true }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: cover, label: Cover Image, type: image }
      - { name: excerpt, label: Excerpt, type: text }
      - { name: draft, label: Draft, type: boolean, default: false }
      - { name: featured, label: Featured, type: boolean, default: false }
      - { name: body, label: Body, type: rich-text }

  - name: films
    label: Films
    type: collection
    path: src/content/films
    filename: "{slug}.md"
    format: yaml-frontmatter
    view:
      fields: [title, year]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: slug, label: Slug, type: string, required: true }
      - { name: year, label: Year, type: string }
      - { name: duration, label: Duration, type: string }
      - { name: video, label: Video URL, type: string }
      - { name: cover, label: Thumbnail, type: image }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: excerpt, label: Description, type: text }
      - { name: draft, label: Draft, type: boolean, default: false }
      - { name: featured, label: Featured, type: boolean, default: false }
      - { name: body, label: Body, type: rich-text }

  - name: notes
    label: Notes
    type: collection
    path: src/content/notes
    filename: "{slug}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: slug, label: Slug, type: string, required: true }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: draft, label: Draft, type: boolean, default: false }
      - { name: body, label: Body, type: rich-text }
