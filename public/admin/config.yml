backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: editorial_workflow

collections:
  - name: "photography"
    label: "Photography"
    folder: "src/content/photography"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "slug", label: "Slug", widget: "string" }
      - { name: "year", label: "Year", widget: "string", required: false }
      - { name: "location", label: "Location", widget: "string", required: false }
      - { name: "tags", label: "Tags", widget: "list", required: false }
      - { name: "cover", label: "Cover Image", widget: "image", required: false }
      - { name: "gallery", label: "Gallery Images", widget: "list", field: { name: "image", label: "Image", widget: "image" }, required: false }
      - { name: "excerpt", label: "Excerpt", widget: "text", required: false }
      - { name: "draft", label: "Draft", widget: "boolean", default: false, required: false }
      - { name: "body", label: "Body", widget: "markdown" }

  - name: "writing"
    label: "Writing"
    folder: "src/content/writing"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "slug", label: "Slug", widget: "string" }
      - { name: "tags", label: "Tags", widget: "list", required: false }
      - { name: "cover", label: "Cover Image", widget: "image", required: false }
      - { name: "excerpt", label: "Excerpt", widget: "text", required: false }
      - { name: "draft", label: "Draft", widget: "boolean", default: false, required: false }
      - { name: "body", label: "Body", widget: "markdown" }

  - name: "films"
    label: "Films"
    folder: "src/content/films"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "slug", label: "Slug", widget: "string" }
      - { name: "year", label: "Year", widget: "string", required: false }
      - { name: "duration", label: "Duration", widget: "string", required: false }
      - { name: "video", label: "Video embed URL (YouTube/Vimeo)", widget: "string", required: false }
      - { name: "cover", label: "Thumbnail", widget: "image", required: false }
      - { name: "tags", label: "Tags", widget: "list", required: false }
      - { name: "excerpt", label: "Description", widget: "text", required: false }
      - { name: "draft", label: "Draft", widget: "boolean", default: false, required: false }
      - { name: "body", label: "Body", widget: "markdown" }

  - name: "notes"
    label: "Notes"
    folder: "src/content/notes"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "slug", label: "Slug", widget: "string" }
      - { name: "tags", label: "Tags", widget: "list", required: false }
      - { name: "draft", label: "Draft", widget: "boolean", default: false, required: false }
      - { name: "body", label: "Body", widget: "markdown" }
